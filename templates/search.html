{% extends "base.html" %}
{% block title %}Explore destinations · {{ app_name|default('PlanMyTravel') }}{% endblock %}
{% block content %}
<section class="page-hero page-hero-small">
  <div class="container">
    <span class="eyebrow">GO SOMEWHERE GOOD</span>
    <h1>Find your kind of trip.</h1>
    <p>Search destinations, packages, local guides, and experiences.</p>
    <form class="search-panel search-panel-wide" action="{{ url_for('public.search') }}" method="get" role="search" data-live-search>
      <label class="search-field"><span class="field-icon">⌕</span><span><small>Destination or trip</small><input name="q" value="{{ filters.get('q', '') }}" placeholder="Where would you like to go?"></span></label>
      <button class="button button-primary" type="submit">Search trips →</button>
      <div class="catalog-filters">
        <label class="filter-label">Category<input name="category" value="{{ filters.get('category', '') }}" placeholder="Culture, beach, food…"></label>
        <label class="filter-label">Travel style<input name="style" value="{{ filters.get('style', '') }}" placeholder="Family, adventure…"></label>
        <label class="filter-label">Minimum budget<input name="budget_min" type="number" min="0" step="1" value="{{ filters.get('budget_min', '') }}" placeholder="Any"></label>
        <label class="filter-label">Maximum budget<input name="budget_max" type="number" min="0" step="1" value="{{ filters.get('budget_max', '') }}" placeholder="Any"></label>
        <label class="filter-label">Minimum rating<select name="rating"><option value="">Any rating</option>{% for rating in [3, 4, 4.5] %}<option value="{{ rating }}" {% if filters.get('rating') == rating|string %}selected{% endif %}>{{ rating }}+ stars</option>{% endfor %}</select></label>
        <label class="filter-label">Sort by<select name="sort"><option value="recommended" {% if filters.get('sort', 'recommended') == 'recommended' %}selected{% endif %}>Recommended</option><option value="price" {% if filters.get('sort') == 'price' %}selected{% endif %}>Price: low to high</option><option value="rating" {% if filters.get('sort') == 'rating' %}selected{% endif %}>Top rated</option><option value="name" {% if filters.get('sort') == 'name' %}selected{% endif %}>Name</option></select></label>
      </div>
    </form>
  </div>
</section>
<section class="section section-tight">
  <div class="container">
    <div id="search-results" aria-live="polite" aria-busy="false">
      {% include "search_results.html" %}
    </div>
  </div>
</section>
{% endblock %}
